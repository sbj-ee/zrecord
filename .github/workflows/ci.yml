name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            qt6-base-dev \
            portaudio19-dev \
            libsndfile1-dev

      # -Werror lives here rather than in CMakeLists.txt so local builds
      # against other Qt/PortAudio versions aren't blocked by warnings from
      # their headers.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package (.deb)
        working-directory: build
        run: cpack -G DEB

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: zrecord-deb
          path: build/*.deb
          if-no-files-found: error
