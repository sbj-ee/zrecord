name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            qt6-base-dev \
            portaudio19-dev \
            libsndfile1-dev \
            libsamplerate0-dev

      # -Werror lives here rather than in CMakeLists.txt so local builds
      # against other Qt/PortAudio versions aren't blocked by warnings from
      # their headers.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build
        run: cmake --build build -j$(nproc)

      # The suites are GUILESS, so they need no display or audio device.
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Package (.deb)
        working-directory: build
        run: cpack -G DEB

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: zrecord-deb
          path: build/*.deb
          if-no-files-found: error

  # The same suites under AddressSanitizer (with leak checking) and
  # UndefinedBehaviorSanitizer. tests/CMakeLists.txt sets
  # UBSAN_OPTIONS=halt_on_error=1, so any UB report fails the test.
  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            qt6-base-dev \
            portaudio19-dev \
            libsndfile1-dev \
            libsamplerate0-dev

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Werror"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan -j$(nproc)

      - name: Test
        working-directory: build-asan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ctest --output-on-failure
