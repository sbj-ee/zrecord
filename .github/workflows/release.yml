name: Release

# Pushing a tag v<version> builds, tests and packages that commit and
# publishes a GitHub Release with the .deb attached. Nothing else triggers
# it. The tag must match project(... VERSION ...) in CMakeLists.txt.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            dpkg-dev \
            qt6-base-dev \
            portaudio19-dev \
            libsndfile1-dev \
            libsamplerate0-dev \
            libsodium-dev

      - name: Check the tag matches the project version
        id: version
        run: |
          version=$(sed -n 's/^project(zrecord .*VERSION \([0-9][0-9.]*\)).*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "::error::could not read the project version from CMakeLists.txt"; exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ZRECORD_RELEASE drops the +g<sha> development suffix.
      - name: Configure
        run: cmake -S . -B build -DZRECORD_RELEASE=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Package (.deb)
        working-directory: build
        run: |
          cpack -G DEB
          deb=$(ls *.deb)
          dpkg-deb -f "$deb" Package Version Depends Recommends
          test "$(dpkg-deb -f "$deb" Version)" = "${{ steps.version.outputs.version }}"

      - name: Release notes from CHANGELOG.md
        run: |
          # The "## [<version>]" section, up to the next "## [" heading.
          awk -v v="${{ steps.version.outputs.version }}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"; exit 1
          fi

      # SHA256SUMS lists the .deb; it is signed with minisign by the shared
      # release key (DBC46B23C3AF0EF3, the same key as zwriter and zedit).
      # The in-app updater installs nothing without a valid signature.
      - name: Assemble and sign SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          # minisign secret key (the whole minisign.key file) and its password.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp build/*.deb out/
          (cd out && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS && sha256sum -c SHA256SUMS)
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::Secret MINISIGN_SECRET_KEY is not set: refusing to publish an unsigned release"
            exit 1
          fi
          sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "${MINISIGN_PASSWORD:-}" \
            | minisign -S -s "$key" -m out/SHA256SUMS -t "zrecord $GITHUB_REF_NAME SHA256SUMS"
          rm -f "$key"
          # Verify against the public key compiled into this commit.
          pub=$(sed -n 's/.*kUpdateSigningPublicKey\[\] = "\(RW[A-Za-z0-9+/=]*\)".*/\1/p' src/UpdateSigningKey.cpp)
          test -n "$pub"
          minisign -V -P "$pub" -m out/SHA256SUMS -x out/SHA256SUMS.minisig

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.deb out/SHA256SUMS out/SHA256SUMS.minisig \
            --title "zrecord ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag
